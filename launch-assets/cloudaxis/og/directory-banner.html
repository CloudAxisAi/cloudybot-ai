<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #06080d; color: #f8fafc;
    display: flex; flex-direction: column; justify-content: center;
    padding: 64px 72px;
    background-image: radial-gradient(circle at 75% 25%, rgba(20,184,166,0.2), transparent 45%);
  }
  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
  .row img { width: 72px; height: 72px; }
  .brand { font-size: 42px; font-weight: 700; }
  h1 { font-size: 56px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; max-width: 900px; }
  h1 em { font-style: normal; color: #2dd4bf; }
  p { margin-top: 22px; font-size: 24px; color: #94a3b8; max-width: 820px; line-height: 1.4; }
  .chips { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 15px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(20,184,166,0.45); color: #99f6e4;
  }
</style>
</head>
<body>
  <div class="row">
    <img src="../../../sites/cloudaxis/assets/cloudaxis-logo-mark.svg" alt="">
    <div class="brand">CloudAxis</div>
  </div>
  <h1>Isolated <em>cloud computer</em> for your AI agents</h1>
  <p>Persistent desktop · real browser · multi-agent workflows · hosted models · no API keys</p>
  <div class="chips">
    <span class="chip">Agent OS</span>
    <span class="chip">Browser automation</span>
    <span class="chip">Scheduled tasks</span>
    <span class="chip">Excel &amp; Word</span>
    <span class="chip">WhatsApp alerts</span>
  </div>
</body>
</html>
